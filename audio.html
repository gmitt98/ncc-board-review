<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio review · Neurocritical Care Board Review</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--muted:#666;--line:#e2e2de;--accent:#2b6cb0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141517;--card:#1e2023;--ink:#e8e8e6;--muted:#9a9a96;--line:#33363b;--accent:#7fb3f0}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px}
a{color:var(--accent)}
audio{width:100%;margin:12px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
ol{padding-left:22px;columns:2;column-gap:32px}
ol li{margin:3px 0;break-inside:avoid}
ol button{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-align:left;padding:0}
@media (max-width:600px){ol{columns:1}}
:root[data-theme=dark]{--bg:#141517;--card:#1e2023;--ink:#e8e8e6;--muted:#9a9a96;--line:#33363b;--accent:#7fb3f0}
</style>
</head>
<body>
<div class="wrap">
  <p><a href="index.html">← Questions</a></p>
  <h1>High-yield audio review</h1>
  <p class="muted">About an hour, 22 chapters. Built from <em>The Practice of Neurocritical Care</em>, 2nd ed. Text-to-speech narration. <a href="audio/transcript.md">Transcript</a> · <a href="audio/ncc_audio_summary.m4a" download>Download M4A</a></p>
  <audio id="a" controls preload="metadata" src="audio/ncc_audio_summary.m4a"></audio>
  <div class="card">
    <strong>Chapters</strong> <span class="muted">(click to jump)</span>
    <ol id="ch"></ol>
  </div>
</div>
<script>
(function(){try{const t=localStorage.getItem("ncc-theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);const z=parseInt(localStorage.getItem("ncc-zoom")||"100",10);if(z&&z!==100)document.documentElement.style.fontSize=z+"%";}catch(e){}})();
const a=document.getElementById('a'), ol=document.getElementById('ch');
fetch('audio/chapters.json').then(r=>r.json()).then(chs=>{chs.forEach(c=>{const m=Math.floor(c.start/60),s=Math.round(c.start%60);const li=document.createElement('li');const b=document.createElement('button');b.textContent=c.title+' · '+m+':'+String(s).padStart(2,'0');b.onclick=()=>{a.currentTime=c.start;a.play()};li.appendChild(b);ol.appendChild(li)});});
</script>
</body>
</html>
