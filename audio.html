<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio review · Neurocritical Care Board Review</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--muted:#666;--line:#e2e2de;--accent:#2b6cb0}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1e2023;--ink:#e8e8e6;--muted:#9a9a96;--line:#33363b;--accent:#7fb3f0}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px}
a{color:var(--accent)}
audio{width:100%;margin:12px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
ol{padding-left:22px;columns:2;column-gap:32px}
ol li{margin:3px 0;break-inside:avoid}
ol button{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-align:left;padding:0}
@media (max-width:600px){ol{columns:1}}
</style>
</head>
<body>
<div class="wrap">
  <p><a href="index.html">← Questions</a></p>
  <h1>High-yield audio review</h1>
  <p class="muted">63 minutes, 22 chapters. Built from <em>The Practice of Neurocritical Care</em>, 2nd ed. Text-to-speech narration. <a href="audio/transcript.md">Transcript</a> · <a href="audio/ncc_audio_summary.m4a" download>Download M4A</a></p>
  <audio id="a" controls preload="metadata" src="audio/ncc_audio_summary.m4a"></audio>
  <div class="card">
    <strong>Chapters</strong> <span class="muted">(click to jump)</span>
    <ol id="ch"></ol>
  </div>
</div>
<script>
const chapters=[[0,"Introduction"],[0.5,"Intracranial pressure and cerebral physiology"],[3.7,"Airway and mechanical ventilation"],[8.6,"Acid base, sodium, and electrolytes"],[12.4,"Cardiovascular monitoring"],[14.7,"Glucose, endocrine, and nutrition"],[18.0,"Trauma and burns"],[19.6,"Acute ischemic stroke"],[23.9,"Intracerebral hemorrhage"],[27.2,"Subarachnoid hemorrhage"],[30.5,"Traumatic brain injury"],[33.0,"Spinal cord injury"],[34.2,"Seizures and status epilepticus"],[37.0,"Neuromuscular disorders"],[40.1,"Coma, brain death, and prognostication"],[42.6,"Cardiac arrest and temperature management"],[45.0,"Neuroinfectious disease"],[47.6,"Neuroimmunology, encephalopathy, and delirium"],[50.2,"Multimodality neuromonitoring"],[52.3,"Sedation, analgesia, and pharmacology"],[55.3,"Pregnancy, pediatrics, perioperative, and rehabilitation"],[59.1,"Administration and quality"],[60.3,"Rapid review of numbers"]];
const a=document.getElementById('a'), ol=document.getElementById('ch');
chapters.forEach(([m,t])=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=t+' · '+Math.floor(m)+':'+String(Math.round((m%1)*60)).padStart(2,'0');b.onclick=()=>{a.currentTime=m*60;a.play()};li.appendChild(b);ol.appendChild(li)});
</script>
</body>
</html>
